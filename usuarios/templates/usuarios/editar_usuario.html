{% extends 'base/base.html' %}
{% block title %}Editar Usuario{% endblock %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="container mx-auto mt-8">
    <h2 class="text-2xl font-bold text-center mb-6">Editar Usuario</h2>
    <form method="post" class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto">
        {% csrf_token %}
        <div class="mb-4">
            {{ form.email.label_tag }}
            {{ form.email }}
        </div>
        <div class="mb-4">
            {{ form.nombre.label_tag }}
            {{ form.nombre }}
        </div>
        <div class="mb-4">
            <label class="flex items-center gap-2 cursor-pointer">
                {{ form.is_active }}
                <span class="block w-6 h-6 bg-gray-200 border rounded-md flex items-center justify-center">
                    <i class="bx bx-check text-green-500" style="{{ form.is_active.value|yesno:'display: block;,display: none;' }}"></i>
                </span>
                Activo
            </label>
        </div>
        <div class="mb-4">
            <label class="flex items-center gap-2 cursor-pointer">
                {{ form.is_staff }}
                <span class="block w-6 h-6 bg-gray-200 border rounded-md flex items-center justify-center">
                    <i class="bx bx-check text-blue-500" style="{{ form.is_staff.value|yesno:'display: block;,display: none;' }}"></i>
                </span>
                Staff
            </label>
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">
            Guardar Cambios
        </button>
    </form>
</div>

<script>
    document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
        checkbox.addEventListener('change', function () {
            const icon = this.nextElementSibling.querySelector('i');
            if (this.checked) {
                icon.style.display = 'block';
            } else {
                icon.style.display = 'none';
            }
        });
    });
</script>

{% if messages %}
<script>
    {% for message in messages %}
    Swal.fire({
        title: 'Éxito',
        text: '{{ message }}',
        icon: 'success',
        timer: 2000,
        showConfirmButton: false,
        toast: true,
        position: 'top-end'
    });
    {% endfor %}
</script>
{% endif %}
{% endblock %}
